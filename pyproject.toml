[project]
name = "fasa-print-agent"
version = "0.1.0"
description = "Agente de impresión centralizado para Ferretería Avenida S.A. (FASA) — corre en SERVERFASA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "FASA / Vogel" }]
dependencies = [
  "pymysql>=1.1.0",
  "reportlab>=4.0",
  "pymupdf>=1.24",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.scripts]
fasa-print-agent = "fasa_print_agent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
